name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload'
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    if: github.event.release.tag_name != 'nightly' && inputs.tag != 'nightly'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-package.yml
    with:
      checkout_ref: ${{ github.event.release.tag_name || inputs.tag }}
      revision: ${{ github.event.release.tag_name || inputs.tag }}
      app_version: ${{ github.event.release.tag_name || inputs.tag }}
      artifact_prefix: release
      asset_prefix: vripper
      jar_suffix: ''
      docker_tags: |
        ghcr.io/dev-claw/vripper-web:latest
        ghcr.io/dev-claw/vripper-web:${{ github.event.release.tag_name || inputs.tag }}

  release:
    needs: build
    if: github.event.release.tag_name != 'nightly' && inputs.tag != 'nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${VERSION}" dist/* --repo "${{ github.repository }}" --clobber
