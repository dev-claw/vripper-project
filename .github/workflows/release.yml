name: Release

on:
  release:
    types: [created]

permissions:
  contents: read

env:
  VERSION: ${{ github.event.release.tag_name }}

jobs:
  build:
    if: github.event.release.tag_name != 'nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven

      - name: Build GUI and web jars
        run: |
          mvn -N -q install --file pom.xml
          mvn -B -q install --file vripper-core/pom.xml
          mvn -B -q install --file vripper-gui/pom.xml
          mvn -B -q install --file vripper-web-ui/pom.xml
          mvn -B -q install --file vripper-web/pom.xml
          mv "vripper-gui/target/vripper-gui-${VERSION}-jar-with-dependencies.jar" "vripper-gui/target/vripper-noarch-gui-${VERSION}.jar"
          mv "vripper-web/target/vripper-web-${VERSION}.jar" "vripper-web/target/vripper-noarch-web-${VERSION}.jar"

      - name: Upload GUI jar
        uses: actions/upload-artifact@v4
        with:
          name: gui-jar
          path: vripper-gui/target/vripper-noarch-gui-${{ github.event.release.tag_name }}.jar
          retention-days: 1
          compression-level: 0

      - name: Upload web jar
        uses: actions/upload-artifact@v4
        with:
          name: web-jar
          path: vripper-web/target/vripper-noarch-web-${{ github.event.release.tag_name }}.jar
          retention-days: 1
          compression-level: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          mkdir -p docker_build
          cp Dockerfile docker_build/Dockerfile
          cp "vripper-web/target/vripper-noarch-web-${VERSION}.jar" docker_build/vripper-web.jar
          docker build -t ghcr.io/dev-claw/vripper-web docker_build
          docker tag ghcr.io/dev-claw/vripper-web:latest "ghcr.io/dev-claw/vripper-web:${VERSION}"
          docker push ghcr.io/dev-claw/vripper-web:latest
          docker push "ghcr.io/dev-claw/vripper-web:${VERSION}"

  package:
    needs: build
    if: github.event.release.tag_name != 'nightly'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            platform: linux
            arch_suffix: ''
            portable_path: VRipper
          - os: windows-latest
            target: windows
            platform: windows
            arch_suffix: ''
            portable_path: VRipper
          - os: macos-15-intel
            target: macos-intel
            platform: macos
            arch_suffix: .x86_64
            portable_path: VRipper.app
          - os: macos-latest
            target: macos-arm
            platform: macos
            arch_suffix: .arm64
            portable_path: VRipper.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Download GUI jar
        uses: actions/download-artifact@v4
        with:
          name: gui-jar
          path: jar-download

      - name: Prepare packaging
        shell: bash
        run: cp jar-download/vripper-noarch-gui-${{ github.event.release.tag_name }}.jar jpackage/jar/vripper-gui.jar

      - if: matrix.target == 'linux'
        name: Package for Linux
        run: |
          cd jpackage
          jpackage --app-version "${VERSION}" "@jpackage.cfg" "@jpackage-app-image.cfg" --icon resources/VRipper.png
          jpackage --app-version "${VERSION}" "@jpackage.cfg" "@jpackage-linux.cfg" --resource-dir resources --type deb
          jpackage --app-version "${VERSION}" "@jpackage.cfg" "@jpackage-linux.cfg" --resource-dir resources --type rpm
          mv "dist/vripper-${VERSION}-1.x86_64.rpm" "dist/vripper-linux-${VERSION}.x86_64.rpm"
          mv "dist/vripper_${VERSION}-1_amd64.deb" "dist/vripper-linux-${VERSION}_amd64.deb"

      - if: matrix.target == 'windows'
        name: Package for Windows
        run: |
          cd jpackage
          jpackage --app-version "${{ github.event.release.tag_name }}" "@jpackage.cfg" "@jpackage-app-image.cfg" --icon resources/VRipper.ico
          jpackage --app-version "${{ github.event.release.tag_name }}" "@jpackage.cfg" "@jpackage-windows.cfg" --resource-dir resources --type msi
          jpackage --app-version "${{ github.event.release.tag_name }}" "@jpackage.cfg" "@jpackage-windows.cfg" --resource-dir resources --type exe
          cd dist
          ren "VRipper-${{ github.event.release.tag_name }}.msi" "vripper-windows-installer-${{ github.event.release.tag_name }}.msi"
          ren "VRipper-${{ github.event.release.tag_name }}.exe" "vripper-windows-installer-${{ github.event.release.tag_name }}.exe"

      - if: matrix.target == 'macos-arm'
        name: Package for macOS (arm64)
        run: |
          cd jpackage
          jpackage --app-version "${VERSION}" "@jpackage.cfg" "@jpackage-app-image.cfg" --icon resources/VRipper.icns
          jpackage --app-version "${VERSION}" "@jpackage.cfg" "@jpackage-macos.cfg" --resource-dir resources --type pkg
          jpackage --app-version "${VERSION}" "@jpackage.cfg" "@jpackage-macos.cfg" --resource-dir resources --type dmg
          mv "dist/VRipper-${VERSION}.pkg" "dist/vripper-macos-${VERSION}.arm64.pkg"
          mv "dist/VRipper-${VERSION}.dmg" "dist/vripper-macos-${VERSION}.arm64.dmg"

      - if: matrix.target == 'macos-intel'
        name: Package for macOS (x86_64)
        run: |
          cd jpackage
          jpackage --app-version "${VERSION}" "@jpackage.cfg" "@jpackage-app-image.cfg" --icon resources/VRipper.icns
          jpackage --app-version "${VERSION}" "@jpackage.cfg" "@jpackage-macos.cfg" --resource-dir resources --type pkg
          jpackage --app-version "${VERSION}" "@jpackage.cfg" "@jpackage-macos.cfg" --resource-dir resources --type dmg
          mv "dist/VRipper-${VERSION}.pkg" "dist/vripper-macos-${VERSION}.x86_64.pkg"
          mv "dist/VRipper-${VERSION}.dmg" "dist/vripper-macos-${VERSION}.x86_64.dmg"

      - name: Zip portable
        uses: thedoctor0/zip-release@0.7.1
        with:
          type: 'zip'
          directory: 'jpackage/dist'
          path: ${{ matrix.portable_path }}
          filename: vripper-${{ matrix.platform }}-portable-${{ github.event.release.tag_name }}${{ matrix.arch_suffix }}.zip

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: jpackage/dist/vripper-*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    needs: [build, package]
    if: github.event.release.tag_name != 'nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}" --clobber
