syntax = "proto3";
option java_package = "me.vripper.proto";

message ViperSettings {
  bool login = 1;
  string username = 2;
  string password = 3;
  bool thanks = 4;
  string host = 5;
  int64 requestLimit = 6;
  bool fetchMetadata = 7;
}

message DownloadSettings {
  string downloadPath = 1;
  bool autoStart = 2;
  int32 autoQueueThreshold = 3;
  bool forceOrder = 4;
  bool forumSubDirectory = 5;
  bool threadSubLocation = 6;
  bool clearCompleted = 7;
  bool appendPostId = 8;
}

message ConnectionSettings {
  int32 maxConcurrentPerHost = 1;
  int32 maxGlobalConcurrent = 2;
  int32 timeout = 3;
  int32 maxAttempts = 4;
}

message SystemSettings {
  string tempPath = 1;
  bool enableClipboardMonitoring = 2;
  int32 clipboardPollingRate = 3;
  int32 maxEventLog = 4;
}

message HostSettingsMap {
  map<string, string> settings = 1;
}

message AutomationSettings {
  bool enabled = 1;
  string mode = 2;
  bool compress = 3;
  string action = 4;
  string moveDestination = 5;
  bool moveOverride = 6;
  string webhookUrl = 7;
  string webhookMethod = 8;
  string webhookPayload = 9;
  string scriptPath = 10;
  string scriptArguments = 11;
  repeated string requiredCustomFields = 12;
}

message Settings {
  ConnectionSettings connectionSettings = 1;
  DownloadSettings downloadSettings = 2;
  ViperSettings viperSettings = 3;
  SystemSettings systemSettings = 4;
  map<string, HostSettingsMap> hostSettings = 5;
  AutomationSettings automationSettings = 6;
}